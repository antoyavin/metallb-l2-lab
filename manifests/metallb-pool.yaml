# Plage d'adresses que MetalLB peut attribuer aux Services LoadBalancer.
# Elle doit rester hors de la plage DHCP de la box.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: maison
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.200-192.168.1.210
---
# Annonce les adresses du pool "maison" en mode L2 (ARP).
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: maison
  namespace: metallb-system
spec:
  ipAddressPools:
    - maison
